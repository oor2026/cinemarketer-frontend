<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e50914">
    <title>Sin conexión — Cinemarketer</title>
    <style>
        /* Todo en línea a propósito: esta página se muestra sin conexión,
           así que no puede depender de ningún otro archivo salvo el logo,
           que el service worker ya tiene guardado. */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            background: #ffffff;
            color: #16151a;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        img { width: 120px; height: auto; }
        h1 { font-size: 1.25rem; margin: 6px 0 0; }
        p { font-size: 0.95rem; color: #5b6070; max-width: 320px; line-height: 1.45; margin: 0; }
        button {
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: #e50914;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img src="/assets/images/isologotipo.webp" alt="Cinemarketer">
    <h1>No hay conexión</h1>
    <p>Para ver la cartelera, tu credencial y tu Sala necesitás internet. Revisá tu conexión y volvé a intentar.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
</body>
</html>
