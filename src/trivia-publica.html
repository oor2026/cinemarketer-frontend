<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina Adivinador — Cinemarketer</title>

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Cinemarketer">
    <meta property="og:title" content="🎬 Adivina Adivinador — la trivia diaria de Cinemarketer">
    <meta property="og:description" content="10 preguntas, un intento por día. ¿Cuántas acertás?">
    <meta property="og:image" content="https://cinemarketer.com.ar/assets/images/og-default.png">
    <meta id="ogUrl" property="og:url" content="https://cinemarketer.com.ar">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/publicacion-publica.css">
    <link rel="stylesheet" href="css/feed-films.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header class="pub-header">
    <a href="/" class="pub-logo">
        <img src="assets/images/isologotipo.webp" alt="Cinemarketer">
    </a>
    <div class="pub-header-btns">
        <a href="/login.html" class="btn-login">Iniciar sesión</a>
        <a href="/register.html" class="btn-registro">Registrarme gratis</a>
    </div>
</header>

<div class="pub-layout">

    <div class="pub-poster-rail pub-poster-rail-left">
        <div class="pub-poster-col" id="pubPosterColLeftOuter"></div>
        <div class="pub-poster-col" id="pubPosterColLeftInner"></div>
    </div>

    <main class="pub-main">

        <div id="pubLoading" class="pub-loading">
            <i class="fas fa-spinner fa-spin"></i>
        </div>

        <div id="pubError" class="pub-error" style="display:none;">
            <i class="fas fa-exclamation-circle"></i>
            <p>No pudimos cargar la trivia de hoy.</p>
            <a href="/">Volver al inicio</a>
        </div>

        <div id="pubContenido" style="display:none;">
            <div class="pub-card">
                <div id="triviaModalContenido"></div>
            </div>
        </div>

    </main>

    <div class="pub-poster-rail pub-poster-rail-right">
        <div class="pub-poster-col" id="pubPosterColRightInner"></div>
        <div class="pub-poster-col" id="pubPosterColRightOuter"></div>
    </div>

</div>

<script src="js/config.js"></script>
<script src="js/trivia.js"></script>
<script>
    // Reemplaza el cierre del modal (no aplica acá, no hay modal — la página
    // entera es el juego) por un mensaje simple en el mismo lugar.
    window.cerrarTrivia = function() {
        if (window._triviaTimerInterval) clearInterval(window._triviaTimerInterval);
        document.getElementById('triviaModalContenido').innerHTML = `
            <div class="trivia-resultado">
                <i class="fas fa-clapperboard" style="color:#7c3aed;"></i>
                <h3>Cuando quieras</h3>
                <p>La trivia de hoy te espera — volvé a esta página cuando tengas ganas de jugar.</p>
            </div>`;
    };

    async function iniciarTriviaPublica() {
        try {
            const res = await fetch(`${CONFIG.API_URL}/trivia/estado${triviaQueryParam()}`, {
                headers: triviaAuthHeaders()
            });
            const estado = await res.json();

            const esPrimeraPregunta = estado.estado === 'EN_CURSO' && estado.preguntaActual === 1;
            if (esPrimeraPregunta && !triviaYaAdvertido()) {
                renderTriviaAdvertencia(estado);
            } else {
                renderTriviaEstado(estado);
            }

            document.getElementById('ogUrl').content = window.location.href;
            document.getElementById('pubLoading').style.display = 'none';
            document.getElementById('pubContenido').style.display = 'block';
        } catch (e) {
            document.getElementById('pubLoading').style.display = 'none';
            document.getElementById('pubError').style.display = 'flex';
        }
    }

    iniciarTriviaPublica();
    cargarPostersLaterales();

    // Mismo mecanismo de rieles decorativos que publicacion.html — sin cambios.
    async function cargarPostersLaterales() {
        const cols = {
            leftOuter:  document.getElementById('pubPosterColLeftOuter'),
            leftInner:  document.getElementById('pubPosterColLeftInner'),
            rightInner: document.getElementById('pubPosterColRightInner'),
            rightOuter: document.getElementById('pubPosterColRightOuter')
        };
        if (!cols.leftOuter) return;

        const TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIzZjFjNjgyZDZkNTMzNWIzMjQyNzc3MzQ2OWUxNmE1MSIsIm5iZiI6MTc3MTE3NzkxNy44ODEsInN1YiI6IjY5OTIwN2JkOTRjZDE0N2M5ZjFhZWY2OSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.8GieGBESmuWLnoD_IyFrBbXBCX40qUKE8vY6VBMj_DM';
        const BASE_IMG = 'https://image.tmdb.org/t/p/w300';
        const NECESARIAS = 24;

        const fetchTmdb = async (endpoint, page) => {
            try {
                const res = await fetch(
                    `https://api.themoviedb.org/3/movie/${endpoint}?language=es-AR&region=AR&page=${page}`,
                    { headers: { 'Authorization': `Bearer ${TMDB_TOKEN}`, 'accept': 'application/json' } }
                );
                const data = await res.json();
                return data.results || [];
            } catch (e) {
                return [];
            }
        };

        try {
            let pool = [];
            const agregar = (lista) => {
                lista.filter(m => m.poster_path && !pool.find(p => p.id === m.id))
                     .forEach(m => pool.push(m));
            };

            agregar(await fetchTmdb('now_playing', 1));
            if (pool.length < NECESARIAS) agregar(await fetchTmdb('popular', 1));
            if (pool.length < NECESARIAS) agregar(await fetchTmdb('now_playing', 2));
            if (pool.length < NECESARIAS) agregar(await fetchTmdb('popular', 2));

            if (pool.length === 0) return;

            const armarPoster = (m) => `
                <a href="/pelicula?id=${m.id}" class="pub-poster-rail-item" title="${(m.title || '').replace(/"/g,'')}">
                    <img src="${BASE_IMG}${m.poster_path}" alt="${m.title || ''}" loading="lazy">
                </a>`;

            const tandas = [
                pool.slice(0, 6), pool.slice(6, 12), pool.slice(12, 18), pool.slice(18, 24)
            ];

            if (cols.leftOuter)  cols.leftOuter.innerHTML  = tandas[0].map(armarPoster).join('');
            if (cols.leftInner)  cols.leftInner.innerHTML  = tandas[1].map(armarPoster).join('');
            if (cols.rightInner) cols.rightInner.innerHTML = tandas[2].map(armarPoster).join('');
            if (cols.rightOuter) cols.rightOuter.innerHTML = tandas[3].map(armarPoster).join('');
        } catch (e) {}
    }
</script>
</body>
</html>
