<!-- FILTROS AVANZADOS -->

<!-- VERSION DESKTOP: contenedor normal -->
<div class="filtros-container filtros-desktop">
    <div class="filtros-header" onclick="toggleFiltros()">
        <i class="fas fa-filter"></i>
        <span>Filtros avanzados</span>
        <i class="fas fa-chevron-down" id="filtrosToggle"></i>
    </div>

    <div class="filtros-content" id="filtrosContent">

        <!-- SWITCH PELÍCULA / SERIE -->
        <div class="filtro-grupo">
            <label><i class="fas fa-random"></i> Tipo de contenido</label>
            <div class="filtro-switch-tipo">
                <button type="button" id="filtroSwitchPelicula" class="filtro-switch-btn activo"
                        onclick="window.toggleFiltroTipo('pelicula')">🎬 Películas</button>
                <button type="button" id="filtroSwitchSerie" class="filtro-switch-btn"
                        onclick="window.toggleFiltroTipo('serie')">📺 Series</button>
            </div>
        </div>

        <!-- Búsqueda por texto - CON AUTOCOMPLETADO -->
        <div class="filtro-grupo busqueda">
            <label><i class="fas fa-search"></i> <span id="filtroBusquedaLabel">Buscar película</span></label>
            <input type="text" id="busquedaInput"
                   placeholder="Título, director, actor..."
                   class="filtro-input"
                   autocomplete="off"
                   maxlength="100">
            <div id="busquedaResultados" class="autocomplete-resultados" style="display: none;"></div>
        </div>

        <div class="filtros-grid">
            <!-- Año -->
            <div class="filtro-grupo">
                <label><i class="fas fa-calendar-alt"></i> Año</label>
                <select id="filtroAnio" class="filtro-select">
                </select>
            </div>

            <!-- Personalidad - Búsqueda con autocompletado (compartido, cambia de endpoint según el switch) -->
            <div class="filtro-grupo">
                <label><i class="fas fa-video"></i> Personalidad </label>
                <input type="text" id="busquedaDirector"
                       placeholder="Escribe nombre de director, actor o productor..."
                       class="filtro-input"
                       autocomplete="off">
                <div id="directorResultados" class="autocomplete-resultados" style="display: none;"></div>
            </div>

            <!-- Duración — Película -->
            <div class="filtro-grupo" id="filtroDuracionPeliculaGrupo">
                <label><i class="fas fa-clock"></i> Duración</label>
                <select id="filtroDuracion" class="filtro-select">
                    <option value="todos">Cualquier duración</option>
                    <option value="corta">Menos 90 min</option>
                    <option value="media">90-120 min</option>
                    <option value="larga">Más 120 min</option>
                </select>
            </div>

            <!-- Temporadas — Serie -->
            <div class="filtro-grupo" id="filtroTemporadasSerieGrupo" style="display:none;">
                <label><i class="fas fa-layer-group"></i> Temporadas</label>
                <select id="filtroTemporadas" class="filtro-select">
                    <option value="todos">Cualquier cantidad</option>
                    <option value="1">1 temporada</option>
                    <option value="2-4">2 a 4 temporadas</option>
                    <option value="5+">5 o más</option>
                </select>
                <small style="color:#999;font-size:0.72rem;display:block;margin-top:0.3rem;">
                    Este filtro puede tardar un poco más — TMDb no lo soporta de forma directa.
                </small>
            </div>
        </div>

        <!-- Botones de acción -->
        <div class="filtros-acciones">
            <button class="btn-aplicar" onclick="window.aplicarFiltros()">
                <i class="fas fa-check"></i> Aplicar filtros
            </button>
            <button class="btn-limpiar" onclick="window.limpiarFiltros()">
                <i class="fas fa-undo"></i> Limpiar
            </button>
        </div>
    </div>
</div>

<!-- VERSION MÓVIL: botón + modal bottom sheet -->
<div class="filtros-mobile" style="display:none;"></div>

<!-- MODAL FILTROS MÓVIL -->
<div class="filtros-modal-overlay" id="filtrosModalOverlay" onclick="cerrarFiltrosModal()"></div>
<div class="filtros-modal-sheet" id="filtrosModalSheet">
    <div class="filtros-modal-header">
        <span><i class="fas fa-filter"></i> Filtros avanzados</span>
        <button onclick="cerrarFiltrosModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="filtros-modal-body">
        <div class="filtro-grupo">
            <label><i class="fas fa-random"></i> Tipo de contenido</label>
            <div class="filtro-switch-tipo">
                <button type="button" id="filtroSwitchPeliculaMobile" class="filtro-switch-btn activo"
                        onclick="window.toggleFiltroTipo('pelicula')">🎬 Películas</button>
                <button type="button" id="filtroSwitchSerieMobile" class="filtro-switch-btn"
                        onclick="window.toggleFiltroTipo('serie')">📺 Series</button>
            </div>
        </div>
        <div class="filtro-grupo">
            <label><i class="fas fa-search"></i> <span id="filtroBusquedaLabelMobile">Buscar película</span></label>
            <input type="text" id="busquedaInputMobile" placeholder="Título, director, actor..." class="filtro-input" autocomplete="off" maxlength="100">
        </div>
        <div class="filtro-grupo">
            <label><i class="fas fa-calendar-alt"></i> Año</label>
            <select id="filtroAnioMobile" class="filtro-select"></select>
        </div>
        <div class="filtro-grupo">
            <label><i class="fas fa-video"></i> Personalidad</label>
            <input type="text" id="busquedaDirectorMobile"
                   placeholder="Escribe nombre de director, actor o productor..."
                   class="filtro-input"
                   autocomplete="off">
            <div id="directorResultadosMobile" class="autocomplete-resultados" style="display: none;"></div>
        </div>
        <div class="filtro-grupo" id="filtroDuracionPeliculaGrupoMobile">
            <label><i class="fas fa-clock"></i> Duración</label>
            <select id="filtroDuracionMobile" class="filtro-select">
                <option value="todos">Cualquier duración</option>
                <option value="corta">Menos 90 min</option>
                <option value="media">90-120 min</option>
                <option value="larga">Más 120 min</option>
            </select>
        </div>
        <div class="filtro-grupo" id="filtroTemporadasSerieGrupoMobile" style="display:none;">
            <label><i class="fas fa-layer-group"></i> Temporadas</label>
            <select id="filtroTemporadasMobile" class="filtro-select">
                <option value="todos">Cualquier cantidad</option>
                <option value="1">1 temporada</option>
                <option value="2-4">2 a 4 temporadas</option>
                <option value="5+">5 o más</option>
            </select>
        </div>
    </div>
    <div class="filtros-modal-footer">
        <button class="btn-limpiar" onclick="limpiarFiltrosMobile()">
            <i class="fas fa-undo"></i> Limpiar
        </button>
        <button class="btn-aplicar" onclick="aplicarFiltrosMobile()">
            <i class="fas fa-check"></i> Aplicar
        </button>
    </div>
</div>
